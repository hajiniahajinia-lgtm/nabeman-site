name: Test Tetrahost SSH connection (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TETRA_SSH_KEY }}
        run: |
          set -eu
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tetrahost_key
          chmod 600 ~/.ssh/tetrahost_key

      - name: Add host key for initial connection
        run: |
          set -eu
          ssh-keyscan -p 22 sam.tetrahost.ir >> ~/.ssh/known_hosts

      - name: Test SSH authentication and inspect web root (no changes)
        run: |
          set -eu
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -p 22 \
            -i ~/.ssh/tetrahost_key azarkham@sam.tetrahost.ir \
            'printf "SSH_AUTH_OK\n"; printf "Remote user: "; whoami; printf "Home: "; pwd; if [ -d /home/azarkham/public_html ]; then echo "NABEMAN_WEBROOT_EXISTS"; else echo "WEBROOT_NOT_FOUND"; fi'
