name: Upload Nabeman site to Tetrahost

on:
  workflow_dispatch:
    inputs:
      confirm_live_sync:
        description: "Type SYNCED only after the current live Tetrahost files have been backed up and compared"
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nabeman repository
        uses: actions/checkout@v4

      - name: Safety check - main branch and live-site sync confirmation
        env:
          CONFIRM_LIVE_SYNC: ${{ inputs.confirm_live_sync }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'STOP: Deployment is allowed only from main after the live site has been synchronized and reviewed.'
            exit 1
          fi
          if [ "$CONFIRM_LIVE_SYNC" != "SYNCED" ]; then
            echo 'STOP: Type SYNCED only after backing up and comparing the current live Tetrahost files.'
            exit 1
          fi

      - name: Safety check - require actual website files
        run: |
          set -eu
          if [ ! -f index.php ] && [ ! -f index.html ]; then
            echo 'STOP: No index.php or index.html found in repository root.'
            echo 'Sync the current live Nabeman site files from Tetrahost before deploying.'
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Upload files without deleting remote files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -eu
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_REMOTE_DIR"

          # Upload only; intentionally no --delete. Existing remote files are not removed.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ftp:ssl-allow yes;
            set ftp:ssl-protect-data yes;
            mirror --reverse --verbose
              --exclude-glob .git/
              --exclude-glob .github/
              --exclude-glob docs/
              --exclude-glob README.md
              --exclude-glob '*.sql'
              --exclude-glob '*.zip'
              --exclude-glob '*.bak'
              --exclude-glob '.env'
              --exclude-glob '.env.*'
              --exclude-glob 'config.php'
              --exclude-glob 'db.php'
              ./ '$FTP_REMOTE_DIR';
            bye
          "
